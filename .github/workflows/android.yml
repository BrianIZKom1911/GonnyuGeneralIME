name: android

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - platforms/android/**
      - platforms/rime/**
      - engines/rime/**
      - resources/**
      - .github/workflows/android.yml

concurrency:
  group: android-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: product
        shell: bash
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libboost-dev libboost-regex-dev
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;26.3.11579264"
      - name: Restore locked native sources
        uses: actions/cache@v4
        with:
          path: build/rime-mobile/sources
          key: rime-sources-${{ runner.os }}-${{ hashFiles('platforms/rime/mobile/engine-lock.json', 'platforms/rime/mobile/fetch_sources.py') }}
      - name: Restore native compilation outputs
        uses: actions/cache@v4
        with:
          path: |
            build/rime-mobile/host
            build/rime-mobile/android
          key: android-native-${{ runner.os }}-${{ runner.arch }}-ndk26.3.11579264-${{ hashFiles('platforms/rime/mobile/engine-lock.json', 'platforms/rime/mobile/build_host.sh', 'platforms/rime/mobile/build_android_engine.sh', 'platforms/rime/mobile/boost_regex/CMakeLists.txt', 'engines/rime/**', 'crates/ffi/include/**') }}
      - name: Restore Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('platforms/android/**/*.gradle', 'platforms/android/**/*.gradle.kts', 'platforms/android/gradle/wrapper/gradle-wrapper.properties') }}
      - env:
          GANNYU_RESOURCE_KEY: ${{ secrets.GANNYU_RESOURCE_KEY }}
          GANNYU_ANDROID_BUILD_VARIANT: release
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: bash platforms/android/build.sh
      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk="build/android/GonnyuGeneralIME-${{ steps.product.outputs.version }}-android.apk"
          apksigner="$ANDROID_SDK_ROOT/build-tools/$(ls "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)/apksigner"
          report="$RUNNER_TEMP/android-signature.txt"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$report"
          if grep -Eqi 'Android Debug|CN=Android Debug' "$report"; then
            echo 'release APK is signed with the Android debug certificate' >&2
            exit 1
          fi
      - run: |
          echo 'KERNEL=="kvm", MODE="0666", GROUP="kvm", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            adb install build/android/GonnyuGeneralIME-${{ steps.product.outputs.version }}-android.apk
            adb shell pm path io.gannyu.input | grep -q "package:"
            adb uninstall io.gannyu.input
      - uses: actions/upload-artifact@v4
        with:
          name: GonnyuGeneralIME-${{ steps.product.outputs.version }}-android
          path: build/android/GonnyuGeneralIME-${{ steps.product.outputs.version }}-android.apk
          if-no-files-found: error
