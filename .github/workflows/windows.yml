name: windows

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - platforms/windows/**
      - resources/**
      - .github/workflows/windows.yml

concurrency:
  group: windows-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: product
        shell: bash
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Identify Rust compiler
        id: compiler
        shell: bash
        run: echo "version=$(rustc --version | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore Rust compilation outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-windows-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**') }}
          restore-keys: |
            rust-windows-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc i686-pc-windows-msvc
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add WixToolset.BootstrapperApplications.wixext/5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - shell: cmd
        env:
          GANNYU_RESOURCE_KEY: ${{ secrets.GANNYU_RESOURCE_KEY }}
        run: platforms\windows\build_installer.bat
      - shell: pwsh
        run: platforms/windows/smoke_installer.ps1 -InstallerPath "build/windows/installer/GonnyuGeneralIME-${{ steps.product.outputs.version }}-windows-installer.exe"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GonnyuGeneralIME-${{ steps.product.outputs.version }}-windows-installer-smoke-logs
          path: |
            ${{ runner.temp }}/gonnyu-installer-smoke/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: GonnyuGeneralIME-${{ steps.product.outputs.version }}-windows-installer
          path: build/windows/installer/GonnyuGeneralIME-${{ steps.product.outputs.version }}-windows-installer.exe
          if-no-files-found: error
