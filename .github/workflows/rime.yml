name: rime

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - platforms/rime/**
      - resources/**
      - .github/workflows/rime.yml

concurrency:
  group: rime-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'push' || github.ref_type != 'branch' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: product
        shell: bash
        run: |
          version="$(awk -F '"' '/^version[[:space:]]*=/ { print $2; exit }' Cargo.toml)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore regional resource outputs
        uses: actions/cache@v4
        with:
          path: build/rime
          key: regional-rime-${{ runner.os }}-${{ runner.arch }}-v1-${{ github.sha }}
          restore-keys: |
            regional-rime-${{ runner.os }}-${{ runner.arch }}-v1-
      - run: bash platforms/rime/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GonnyuGeneralIME-${{ steps.product.outputs.version }}-rime
          path: build/GonnyuGeneralIME-${{ steps.product.outputs.version }}-rime-*.zip
          if-no-files-found: error
